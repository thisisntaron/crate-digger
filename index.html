<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e181d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crate Digger">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Crate Digger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a record shop crate. Phone first, one column, bottom tabs.
   Cards are sleeves with a disc peeking out, framed in their genre color.
   Sorting happens in a radial menu that opens around the card. */
:root{
  color-scheme:dark;
  --bg:#0e181d;
  --surface:#16252c;
  --surface-2:#1f323b;
  --line:#2b424d;
  --fg:#e9f1ef;
  --muted:#90a9ad;
  --accent:#ffa94d;
  --accent-ink:#1d1204;
  --danger:#ff8a80;
  --font-display:'Bricolage Grotesque','Avenir Next','Helvetica Neue',Arial,sans-serif;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --crimp:polygon(0 2.5%,8.33% 0,16.67% 2.5%,25% 0,33.33% 2.5%,41.67% 0,50% 2.5%,58.33% 0,66.67% 2.5%,75% 0,83.33% 2.5%,91.67% 0,100% 2.5%,100% 97.5%,91.67% 100%,83.33% 97.5%,75% 100%,66.67% 97.5%,58.33% 100%,50% 97.5%,41.67% 100%,33.33% 97.5%,25% 100%,16.67% 97.5%,8.33% 100%,0 97.5%);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  margin:0;color:var(--fg);font:15px/1.45 var(--font-body);
  padding-block:calc(14px + env(safe-area-inset-top,0px)) 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:760px;margin:0 auto}
.mono{font:400 12px var(--font-mono);color:var(--muted)}
.h2{font:800 24px/1.1 var(--font-display);letter-spacing:-.015em;margin:0}
.h3{font:800 18px/1.2 var(--font-display);margin:0}
.sub{color:var(--muted);font-size:14px;margin:6px 0 0;max-width:60ch}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:4px 0 18px}
.brand{font:800 28px/1 var(--font-display);letter-spacing:-.025em;margin:0}
.brand small{font:500 11px var(--font-mono);color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-left:8px;vertical-align:middle}
.stats{font:400 12px var(--font-mono);color:var(--muted);text-align:right}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:760px;margin:0 auto;display:flex;gap:6px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);padding:12px 8px;border-radius:12px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.tab.on{background:var(--surface-2);color:var(--fg)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font:600 12px var(--font-mono)}

.btn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:12px 0;font-size:14px}
.ib{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:16px;line-height:1;padding:0}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 13px;border-radius:99px;font-weight:500;font-size:13px;white-space:nowrap;flex:none}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .sw{display:inline-block;width:8px;height:8px;border-radius:50%;background:hsl(var(--gh) 62% 56%);margin-right:6px}

input[type=search],input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px}
.controls{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
.controls select{width:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;-webkit-overflow-scrolling:touch}
.row-head{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* cards: the frame color and inner tint come from the genre hue in --gh */
.card{container-type:inline-size;position:relative;aspect-ratio:5/7;border-radius:12px;background:hsl(var(--gh) 62% 56%);overflow:hidden;isolation:isolate;text-align:left}
.card-in{position:absolute;inset:3cqw;border-radius:9px;background:hsl(var(--gh) 32% 10%);display:flex;flex-direction:column;overflow:hidden}
.art{position:relative;overflow:hidden}
.art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.card .art{flex:none;aspect-ratio:1/.9}
.ribbon{position:absolute;left:0;right:0;bottom:0;padding:1.8cqw 3cqw;font:800 5.8cqw/1 var(--font-display);text-transform:uppercase;letter-spacing:.08em;background:hsl(var(--gh) 70% 60%);color:hsl(var(--gh) 60% 9%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc{position:absolute;right:3cqw;top:3cqw;min-width:8cqw;height:8cqw;padding:0 2cqw;border-radius:99px;background:var(--accent);color:var(--accent-ink);font:600 5cqw/8cqw var(--font-mono);text-align:center}
.info{padding:3.6cqw 4.6cqw 0;min-height:0;flex:1}
.ct{font:800 7.8cqw/1.06 var(--font-display);letter-spacing:-.01em;color:var(--fg);display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ca{font:500 5.6cqw/1.2 var(--font-body);color:hsl(var(--gh) 25% 72%);margin-top:1.4cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{display:flex;justify-content:space-between;gap:2cqw;padding:2cqw 4.6cqw 3.6cqw;font:500 4.6cqw/1 var(--font-mono);color:hsl(var(--gh) 20% 66%);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.cardbtn{display:block;width:100%;padding:0;border:0;background:none;border-radius:12px;transition:transform .12s}
.cardbtn:active{transform:scale(.97)}
.cardbtn{content-visibility:auto;contain-intrinsic-size:auto 230px}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.syncmsg{margin:0;font-size:14px}
.splitbox{margin:12px 0;padding:12px;border:1px solid var(--line,#ffffff22);border-radius:12px;background:hsl(var(--gh,220) 20% 50% / .08)}
.splitbox .btn{width:100%}
#ytbox{position:fixed;z-index:60;left:-400px;top:0;width:200px;height:113px;border-radius:10px;overflow:hidden;background:#000}
#ytbox iframe{width:100%;height:100%;display:block;border:0}
.ytrow{flex:0 0 100%;display:flex;justify-content:center}
.ytslot{width:128px;max-width:100%;aspect-ratio:16/9;border-radius:10px;background:var(--surface)}
/* the video row needs room, so the ring gets a little smaller while it is showing */
body:has(.ytslot) .radial{width:max(250px,min(94vw,460px,calc((100vh - 410px - 84px) / 1.2)));width:max(250px,min(94vw,460px,calc((100dvh - 410px - 84px) / 1.2)))}
.syncmsg.bad{color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;margin-top:10px}
.empty{grid-column:1/-1;color:var(--muted);padding:28px 0;text-align:center}

/* packs */
.packone{display:grid;justify-items:center;margin-top:26px}
.packrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:16px;margin-top:18px}
.pack{display:block;width:100%;padding:0;border:0;background:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));transition:transform .12s}
.pack:active{transform:scale(.97)}
.foil{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;aspect-ratio:5/7;padding:15% 8% 13%;container-type:inline-size;color:#fff;clip-path:var(--crimp);
  background:linear-gradient(155deg,hsl(var(--ph) 72% 58%),hsl(calc(var(--ph) + 50) 70% 30%))}
.foil::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,rgba(255,255,255,0) 0 14px,rgba(255,255,255,.09) 14px 18px)}
.f-top{font:500 8cqw/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase}
.f-disc{width:60cqw;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 1.4cqw rgba(255,255,255,.16);
  background:radial-gradient(circle,hsl(var(--ph) 90% 72%) 0 14%,#0a0d0f 14.5% 17%,transparent 17.5%),repeating-radial-gradient(circle,#0b1013 0 1.2cqw,#162228 1.2cqw 2.4cqw)}
.f-side{font:800 15cqw/1 var(--font-display);text-transform:uppercase}
.f-no{font:400 7cqw/1 var(--font-mono);letter-spacing:.04em;text-align:center}
.pack.big{width:min(62vw,250px);margin:0 auto}
.pack.big.tear{animation:tear .6s ease-in forwards}
@keyframes tear{0%{transform:scale(1)}15%{transform:rotate(-4deg) scale(1.04)}30%{transform:rotate(4deg) scale(1.06)}45%{transform:rotate(-3deg) scale(1.08)}100%{transform:scale(1.35);opacity:0}}
.sync{margin-top:32px;border:1px dashed var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;justify-items:start}
.bk.warn .syncmsg{color:var(--danger)}
.bk input{width:100%;max-width:420px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:inherit;font-size:16px}
.cfbox{position:fixed;inset:0;z-index:66;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.cfin{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:420px;width:100%;display:grid;gap:12px}
.cfin p{margin:0}
.cfin .btn{width:100%}
.cbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px;color:var(--muted)}
.cbar.bad{color:var(--danger);border-color:var(--danger)}
.cbar .btn{padding:6px 12px;min-height:34px;font-size:13px}
.bk .row{display:flex;gap:8px;flex-wrap:wrap}
.sync b{font:800 16px var(--font-display)}

/* decks */
.rdy{color:var(--accent)}
.sect{margin-top:28px}
.steps{margin:12px 0 4px;padding-left:20px;display:grid;gap:8px;font-size:14px}
.decklist{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.deckrow{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.dn{font:800 18px/1.2 var(--font-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm{font:400 12px var(--font-mono);color:var(--muted)}
.chev{grid-row:1/3;grid-column:2;color:var(--muted);font-size:20px}
.deckrow .rbar{grid-column:1/-1;margin-top:10px}
.rbar{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden;background:var(--surface-2);width:100%}
.rbar.empty{display:block}
.back{background:none;border:0;color:var(--muted);padding:4px 0 10px;font-weight:600;font-size:14px}
input.deckname{font:800 28px/1.1 var(--font-display);letter-spacing:-.015em;background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:6px 0;min-height:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.export{width:100%;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:10px 12px;font:400 13px/1.5 var(--font-mono);resize:vertical}
.tracks{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:8px}
.trk{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px}
.trk .no{font:400 12px var(--font-mono);color:var(--muted);width:18px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.tt{flex:1;min-width:0;display:grid}
.tt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv{display:flex;gap:4px;flex:none}
.thumb{width:46px;height:46px;border-radius:9px;padding:2px;background:hsl(var(--gh) 62% 56%);flex:none;display:block}
.thumb .art{width:100%;height:100%;border-radius:7px}

/* add songs sheet */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(4,8,10,.68)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet.enter{animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet.tall{height:82%;display:flex;flex-direction:column;overflow:hidden}
#layer-sheet.above .sheet-bg{z-index:60}#layer-sheet.above .sheet{z-index:61}
.sheet.pick{max-height:78%;overflow-y:auto}
.trk .thumbbtn{border:0;background:none;padding:0;flex:none;position:relative;cursor:pointer}
.trk .thumbbtn::after{content:'▶︎';position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:#fff;background:rgba(4,8,10,.38);border-radius:9px;opacity:0;transition:opacity .15s}
.trk .thumbbtn:hover::after,.trk.playing .thumbbtn::after{opacity:1}
.trk.playing .thumbbtn::after{content:'❚❚';font-size:12px}
.trk.playing{border-color:hsl(var(--gh,170) 60% 55%)}
.pickrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px 14px;margin:0 0 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.pickrow b{font-weight:600}.pickrow span{font:400 12px var(--font-mono);color:var(--muted)}
.pickrow[disabled]{opacity:.45}
.rit{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.rs{display:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.addlist{list-style:none;margin:12px 0 0;padding:0;overflow-y:auto;flex:1;min-height:0;display:grid;gap:8px;align-content:start}
.arow{display:flex;align-items:center;gap:10px;padding:6px 0}

/* full screen overlay: pack opening and the radial sort menu */
.ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;overflow-y:auto;
  background:radial-gradient(ellipse at 50% 40%,#1b3039 0,var(--bg) 62%);
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;flex:none}
/* phone held sideways: card and controls on the left, a grid of playlist tiles on the right */
.cg,.cpv,.rc,.os{display:none}
@media (orientation:landscape) and (max-height:520px),(min-width:700px) and (min-height:521px){
  .ov:has(#radial){display:grid;grid-template-columns:minmax(0,1fr) clamp(236px,38%,330px);grid-template-rows:auto minmax(0,1fr) auto auto;column-gap:12px;row-gap:6px;
    padding-top:max(6px,env(safe-area-inset-top,0px));padding-bottom:max(6px,env(safe-area-inset-bottom,0px));overflow:hidden}
  .ov:has(#radial) .ov-top{grid-column:1/-1;grid-row:1;min-height:0;gap:8px}
  .ov:has(#radial) .ov-top .tr{gap:8px}
  .ov:has(#radial) .ov-top .btn,.ov:has(#radial) .ov-top .chip{min-height:34px;padding-top:4px;padding-bottom:4px}
  .ov:has(#radial) .stage,.ov:has(#radial) .radial,.ov:has(#radial) .cwrap,.ov:has(#radial) .cin,.ov:has(#radial) .dock,.ov:has(#radial) .flipwrap{display:contents}
  .ov:has(#radial) .dots{display:none}
  /* the sideways card: art on the left, details and play controls on the right */
  .ov:has(#radial) .card{grid-column:1;grid-row:2;width:100%;height:100%;min-height:0;aspect-ratio:auto;container-type:size;animation:rise .35s ease-out}
  .ov:has(#radial) .card-in{inset:8px;display:grid;grid-template-columns:min(calc(100cqh - 16px),48cqw) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);column-gap:10px;align-content:start}
  .ov:has(#radial) .card .art{grid-column:1;grid-row:1/-1;aspect-ratio:auto;width:100%;height:100%}
  .ov:has(#radial) .card .ribbon,.ov:has(#radial) .card .dc{display:none}
  .ov:has(#radial) .card .info{grid-column:2;grid-row:1;padding:6px 8px 0 0;flex:none}
  .ov:has(#radial) .card .ct{font-size:clamp(14px,4cqw,18px);line-height:1.08}
  .ov:has(#radial) .card .ca{font-size:clamp(12px,3.2cqw,14px);margin-top:3px}
  .ov:has(#radial) .card .cg{display:flex;grid-column:2;grid-row:2;align-items:center;flex-wrap:wrap;gap:3px 8px;padding:5px 8px 0 0;font:600 11px/1.2 var(--font-mono);color:hsl(var(--gh) 20% 70%)}
  .ov:has(#radial) .card .cg b{font:800 10.5px/1 var(--font-display);text-transform:uppercase;letter-spacing:.07em;padding:3px 7px;border-radius:99px;background:hsl(var(--gh) 70% 60%);color:hsl(var(--gh) 60% 9%)}
  .ov:has(#radial) .card .foot{display:none}
  .ov:has(#radial) .card .cpv{display:flex;grid-column:2;grid-row:3;align-self:end;min-height:0;padding:0 8px 0 0}
  .ov:has(#radial) .cpv .pv{justify-content:flex-start;gap:6px;width:100%}
  .ov:has(#radial) .cpv .btn{min-height:32px;padding:5px 9px;font-size:12.5px}
  .ov:has(#radial) .cpv .ol{display:none}
  .ov:has(#radial) .cpv .os{display:inline}
  .ov:has(#radial) .cpv .eq{display:none}
  body:has(.ytslot) .ov:has(#radial) .cpv #pvnote{display:none}
  .ov:has(#radial) .cpv .ytrow{justify-content:flex-start}
  .ov:has(#radial) .cpv .ytslot{width:104px}
  .ov:has(#radial) .cpv #pvnote{flex:0 0 100%;font-size:10.5px;line-height:1.2;color:var(--muted)}
  .ov:has(#radial) .dock .btn.primary,.ov:has(#radial) .dock .btn[data-act=next-song]{grid-column:1;grid-row:3;width:100%;min-height:40px}
  .ov:has(#radial) .sortrow{grid-column:1;grid-row:4;width:100%;margin:0;padding:0;border:0}
  .ov:has(#radial) .sortrow .btn{min-height:38px}
  /* playlist tiles */
  .ov:has(#radial) .ring{grid-column:2;grid-row:2/5;position:static;inset:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:calc((100% - 18px) / 4);gap:6px;align-content:start;
    overflow-y:auto;pointer-events:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;min-height:0}
  .ov:has(#radial) .rit{position:static;transform:none;width:auto;aspect-ratio:auto;border-radius:10px;font:600 12px/1.15 var(--font-body);padding:4px 6px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;animation:popg .3s ease-out backwards;animation-delay:calc(var(--k) * 25ms);min-width:0}
  .ov:has(#radial) .rit:active{transform:scale(.95)}
  .ov:has(#radial) .rit .rl{-webkit-line-clamp:2;line-clamp:2}
  .ov:has(#radial) .rit .rc{display:block;font:500 10px/1 var(--font-mono);opacity:.75}

      if(g.s.charAt(st)==='x')ev.push({k:'snare',t:(b0+st)*step});

  var st=snippetStart(id);
  YTP.id=id;YTP.mode='yt';
  try{YTP.player.loadVideoById({videoId:id,startSeconds:st,endSeconds:st+22})}catch(e){YTP.id=null;return false}
  return true;
}
function ytStop(){
  YTP.playing=false;YTP.id=null;
  try{if(YTP.player&&YTP.ready)YTP.player.stopVideo()}catch(e){}
  updatePlayUi();
}
function ytState(ev){
  var st=ev.data;
  if(st===1){
    YTP.playing=true;
    var id=YTP.id;
    if(id&&!YTP.dur[id]){
      var d=0;try{d=YTP.player.getDuration()}catch(e){}
      if(d>0){
        YTP.dur[id]=d;
        if(d<75){var s2=Math.round(d*.3);try{YTP.player.loadVideoById({videoId:id,startSeconds:s2,endSeconds:s2+22})}catch(e){}}
      }
    }
  }else if(st===2||st===0){YTP.playing=false}
  updatePlayUi();
}
function ytError(){
  var id=YTP.id;YTP.playing=false;
  if(id){
    YTP.failed[id]=true;
    if(curCardId()===id){sndStop();YTP.mode='synth';sndStart(id);setNote()}
  }
  updatePlayUi();
}
function pvStart(id){
  sndStop();
  if(clipPlay(id)){updatePlayUi();setNote();return}
  if(ytPlay(id)){setNote();updatePlayUi();return}
  YTP.mode='synth';sndStart(id);setNote();
}

var BKKEY='crate-digger-lastbackup';
function progressSig(){return ownedIds().length+':'+S.decks.reduce(function(n,d){return n+d.ids.length},0)+':'+S.decks.length}
function lastBackup(){try{return JSON.parse(localStorage.getItem(BKKEY)||'null')}catch(e){return null}}
function backupBox(){
  var lb=lastBackup(),has=ownedIds().length>0||S.decks.length>0,msg,warn=false;
  if(!has)msg='Starting fresh on this device? Load a backup file to pick up where you left off.';
  else if(!lb){msg='No backup yet. Progress is saved in this browser, but clearing website data would erase it.';warn=true}
  else{
    var changed=lb.sig!==progressSig(),days=(Date.now()-lb.t)/86400000;

var BKNAME='crate-digger-backup.json';
var BK={handle:null};
var IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function idbOp(mode,fn){
  return new Promise(function(res,rej){
    var r=indexedDB.open('crate-digger-bk',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('h')};
    r.onerror=function(){rej(r.error)};
    r.onsuccess=function(){
      var tx=r.result.transaction('h',mode),q=fn(tx.objectStore('h'));
      tx.oncomplete=function(){res(q&&q.result)};tx.onerror=function(){rej(tx.error)};
    };
  });
}
function keepHandle(h){BK.handle=h;try{idbOp('readwrite',function(st){return st.put(h,'file')}).catch(function(){})}catch(e){}}
try{if(window.showSaveFilePicker)idbOp('readonly',function(st){return st.get('file')}).then(function(h){if(h)BK.handle=h}).catch(function(){})}catch(e){}
function backupJson(){return JSON.stringify({app:'crate-digger',v:1,saved:new Date().toISOString(),state:S})}
function backupDone(msg){
  try{localStorage.setItem(BKKEY,JSON.stringify({t:Date.now(),sig:progressSig()}))}catch(e){}
  toast(msg);render();
}
function downloadBackup(text){
  try{
    var blob=new Blob([text],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=BKNAME;
    document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href)},4000);
    backupDone('Backup saved as '+BKNAME+'. If a file with that name exists, delete the old one.');
  }catch(e){toast('Could not save the backup')}
}
function writeHandle(h,text){return h.createWritable().then(function(w){return w.write(text).then(function(){return w.close()})})}
function saveViaFs(text){
  function go(h){
    var perm=h.requestPermission?h.requestPermission({mode:'readwrite'}):Promise.resolve('granted');
    return perm.then(function(pm){if(pm!=='granted')throw 0;return writeHandle(h,text)}).then(function(){keepHandle(h);backupDone('Backup saved to '+h.name)});
  }
  function pick(){
    window.showSaveFilePicker({suggestedName:BKNAME,types:[{description:'Crate Digger backup',accept:{'application/json':['.json']}}]})
      .then(go).catch(function(e){if(!e||e.name!=='AbortError')downloadBackup(text)});
  }
  if(BK.handle)go(BK.handle).catch(function(){BK.handle=null;pick()});else pick();
}
function saveBackup(){
  var text=backupJson();
  if(window.showSaveFilePicker){saveViaFs(text);return}
  try{
    var file=new File([text],BKNAME,{type:'application/json'});
    if(IS_IOS&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'Crate Digger backup'}).then(function(){backupDone('Pick Save to Files, then Replace if it asks, so there is only one backup file.')},
        function(e){if(!e||e.name!=='AbortError')downloadBackup(text)});
      return;
    }
  }catch(e){}
  downloadBackup(text);
}
function loadBackupPick(){
  if(window.showOpenFilePicker){
    window.showOpenFilePicker({types:[{description:'Crate Digger backup',accept:{'application/json':['.json']}}]}).then(function(hs){
      return hs[0].getFile().then(function(f){return f.text()}).then(function(t){if(loadBackupText(t))keepHandle(hs[0])});
    }).catch(function(e){if(e&&e.name!=='AbortError')$('#loadfile').click()});
    return;
  }
  $('#loadfile').click();
}
function validState(x){
  return x&&typeof x==='object'&&x.owned&&typeof x.owned==='object'&&Array.isArray(x.packs)&&Array.isArray(x.decks)
    &&x.songs&&typeof x.songs==='object'&&x.seen&&typeof x.seen==='object'&&typeof x.nid==='number'&&typeof x.seq==='number'
    &&x.decks.every(function(d){return d&&Array.isArray(d.ids)});
}
function loadBackupText(text){
  var j;try{j=JSON.parse(text)}catch(e){toast('That file is not a Crate Digger backup');return false}
  var st=j&&j.app==='crate-digger'?j.state:j;
  if(!validState(st)){toast('That file is not a Crate Digger backup');return false}
  var u={};st.decks.forEach(function(k){k.ids=k.ids.filter(function(i){if(u[i])return false;u[i]=1;return true})});

  if(have&&!window.confirm('Replace what is on this device ('+ownedIds().length+' cards, '+S.decks.length+' decks) with the backup ('+cards+' cards, '+st.decks.length+' decks)?'))return false;
  sndStop();ST.open=null;ST.radial=null;ST.deckId=null;ST.sheet=null;
  S=st;SONGS=S.songs;artCache={};planCache={};

  save();
  try{localStorage.setItem(BKKEY,JSON.stringify({t:Date.now(),sig:progressSig()}))}catch(e){}

/* ---------- cloud sync: progress saved to a hidden tab of your sheet through a small Google Apps Script ---------- */
var CKEY='crate-digger-cloud',CMKEY='crate-digger-cloudmeta';
var CLOUD={cfg:null,meta:{rev:0,t:0,dev:'',dirty:false},dirty:false,busy:false,state:'off',msg:'',at:0,timer:null,applying:false,seq:0,conflict:null,paused:false,lastPull:0};
function cloudMetaSave(){CLOUD.meta.dirty=CLOUD.dirty;try{localStorage.setItem(CMKEY,JSON.stringify(CLOUD.meta))}catch(e){}}
function cloudLoad(){
  try{CLOUD.cfg=JSON.parse(localStorage.getItem(CKEY)||'null')}catch(e){}
  try{var m=JSON.parse(localStorage.getItem(CMKEY)||'null');if(m&&typeof m==='object')CLOUD.meta=m}catch(e){}
  if(!CLOUD.meta.dev){
    var ua=navigator.userAgent;
    CLOUD.meta.dev=(/iPad/.test(ua)?'iPad':/iPhone/.test(ua)?'iPhone':/Android/.test(ua)?'Android':'Computer')+'-'+Math.random().toString(36).slice(2,6);
  }
  CLOUD.dirty=!!CLOUD.meta.dirty;
  CLOUD.state=CLOUD.cfg?'idle':'off';
  cloudMetaSave();
}
function hasProgress(){return ownedIds().length>0||S.decks.length>0}
function cloudErr(e){
  if(e&&e.code==='token')return 'The secret word does not match the one in your script.';
  if(e&&e.code==='notjson')return 'That link did not answer like the sync script. Check the link, and that the deployment allows Anyone.';
  if(e&&e.code)return 'The sync script said: '+e.code;
  return 'Could not reach the cloud. Will try again.';
}
function cloudParse(r){
  return r.text().then(function(t){
    var j;try{j=JSON.parse(t)}catch(e){throw {code:'notjson'}}
    if(!j||!j.ok)throw {code:(j&&j.error)||'bad',res:j};
    return j;
  });
}
function cloudGet(cfg){
  cfg=cfg||CLOUD.cfg;
  var u=cfg.url+(cfg.url.indexOf('?')<0?'?':'&')+'token='+encodeURIComponent(cfg.token)+'&cb='+Date.now();
  return fetch(u,{cache:'no-store'}).then(cloudParse);
}
function cloudPost(body,keep){
  var txt=JSON.stringify(body);
  return fetch(CLOUD.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:txt,keepalive:!!keep&&txt.length<60000}).then(cloudParse);
}
function cloudDirty(){
  if(!CLOUD||!CLOUD.cfg||CLOUD.applying)return;
  CLOUD.dirty=true;CLOUD.seq++;cloudMetaSave();
  clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(function(){cloudPush()},3000);
}
function cloudRetry(){clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(function(){CLOUD.dirty?cloudPush():cloudPull()},30000)}
function cloudPush(force,keep){
  if(!CLOUD.cfg||CLOUD.busy||(CLOUD.paused&&!force))return Promise.resolve();
  if(!CLOUD.dirty&&!force)return Promise.resolve();
  CLOUD.busy=true;CLOUD.state='saving';var seq=CLOUD.seq;
  return cloudPost({token:CLOUD.cfg.token,base:CLOUD.meta.rev,force:!!force,device:CLOUD.meta.dev,t:Date.now(),data:JSON.stringify(S)},keep).then(function(j){
    CLOUD.busy=false;CLOUD.paused=false;
    CLOUD.meta.rev=j.rev;CLOUD.meta.t=j.t;CLOUD.at=Date.now();
    if(CLOUD.seq===seq)CLOUD.dirty=false;
    cloudMetaSave();CLOUD.state='ok';CLOUD.msg='';
    if(CLOUD.dirty)cloudDirty();
    softRender();
  },function(e){
    CLOUD.busy=false;
    if(e&&e.code==='conflict'){
      cloudGet().then(function(j){CLOUD.conflict=j;showConflict()},function(e2){CLOUD.state='err';CLOUD.msg=cloudErr(e2);softRender();cloudRetry()});
      return;
    }
    CLOUD.state='err';CLOUD.msg=cloudErr(e);softRender();
    if(!(e&&e.code))cloudRetry();
  });
}
function cloudPull(){
  if(!CLOUD.cfg||CLOUD.busy)return Promise.resolve();
  CLOUD.busy=true;CLOUD.state='checking';CLOUD.lastPull=Date.now();
  return cloudGet().then(function(j){
    CLOUD.busy=false;CLOUD.at=Date.now();
    if(!j.data){
      if(hasProgress()){CLOUD.dirty=true;cloudMetaSave();return cloudPush(true)}
      CLOUD.state='ok';softRender();return;
    }
    if((j.rev||0)===CLOUD.meta.rev){CLOUD.state='ok';softRender();if(CLOUD.dirty)return cloudPush();return}
    if(!CLOUD.dirty||!hasProgress()){applyRemote(j);return}
    if(CLOUD.paused){softRender();return}
    CLOUD.conflict=j;showConflict();
  },function(e){
    CLOUD.busy=false;CLOUD.state='err';CLOUD.msg=cloudErr(e);softRender();
  });
}
function applyRemote(j){
  var st;try{st=JSON.parse(j.data)}catch(e){toast('The cloud save could not be read');return false}
  if(!validState(st)){toast('The cloud save could not be read');return false}
  var u={};st.decks.forEach(function(k){k.ids=k.ids.filter(function(i){if(u[i])return false;u[i]=1;return true})});
  CLOUD.applying=true;
  sndStop();ST.open=null;ST.radial=null;ST.deckId=null;ST.sheet=null;
  S=st;SONGS=S.songs;artCache={};planCache={};
  if(rowsCache)mergeRows(rowsCache);
  save();
  CLOUD.applying=false;
  CLOUD.meta.rev=j.rev;CLOUD.meta.t=j.t;CLOUD.dirty=false;CLOUD.paused=false;cloudMetaSave();
  CLOUD.state='ok';CLOUD.at=Date.now();
  renderOverlay();render();toast('Loaded your latest progress from the cloud');
  return true;
}
function closeConflict(){var c=document.getElementById('cfbox');if(c)c.remove()}
function showConflict(){
  closeConflict();
  var j=CLOUD.conflict,st=null;try{st=JSON.parse(j.data)}catch(e){}
  var cc=st&&st.owned?Object.keys(st.owned).length:0,cd=st&&st.decks?st.decks.length:0;

    +'<p class="syncmsg">Cloud: '+cc+' cards, '+cd+' decks, saved '+esc(ago(j.t||Date.now()))+(j.device?' from '+esc(j.device):'')+'.</p>'
    +'<p class="syncmsg">This device: '+ownedIds().length+' cards, '+S.decks.length+' decks, with changes not saved to the cloud yet.</p>'
    +'<button class="btn primary" data-act="cf-cloud">Use the cloud version</button>'
    +'<button class="btn" data-act="cf-device">Keep this device (replaces the cloud)</button>'
    +'<button class="btn ghost" data-act="cf-later">Decide later</button></div>';

  CLOUD.state='conflict';softRender();
}
function cloudBar(){
  var c=CLOUD;
  if(!c.cfg)return '<div class="cbar"><span>Cloud sync is off</span><button class="btn" data-act="tab" data-tab="more">Set up</button></div>';
  var bad=false,msg;
  if(c.state==='saving')msg='Saving...';
  else if(c.state==='checking')msg='Checking the cloud...';
  else if(c.state==='err'){bad=true;msg=c.msg}
  else if(c.state==='conflict'){bad=true;msg='Versions differ. Tap Sync now.'}
  else msg=c.dirty?'Changes waiting to save':'All changes saved';
  return '<div class="cbar'+(bad?' bad':'')+'"><span>'+esc(msg)+'</span><button class="btn" data-act="cloud-now">Sync now</button></div>';
}
function cloudBox(){
  var inner,c=CLOUD;
  if(!c.cfg){
    inner='<p class="syncmsg">Saves your progress to a hidden tab in your Google Sheet, so every device picks up where you left off. Needs a one-time setup.</p>'
      +'<input id="cl-url" type="url" placeholder="Sync link from your script" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Sync link">'
      +'<input id="cl-token" type="text" placeholder="Secret word" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Secret word">'
      +'<div class="row"><button class="btn primary" data-act="cloud-connect">Connect</button></div>';
  }else{
    var msg,bad=false;
    if(c.state==='saving'||c.state==='checking')msg=c.state==='saving'?'Saving...':'Checking the cloud...';
    else if(c.state==='err'){bad=true;msg=c.msg}
    else if(c.state==='conflict'){bad=true;msg='This device and the cloud have different progress. Tap Sync now to choose.'}
    else msg=(c.dirty?'Changes waiting to save. ':'All changes saved. ')+(c.at?'Checked '+ago(c.at)+'.':'');
    inner='<p class="syncmsg'+(bad?' bad':'')+'">'+esc(msg)+'</p><div class="row"><button class="btn primary" data-act="cloud-now">Sync now</button><button class="btn ghost" data-act="cloud-off">Turn off</button></div>';
  }
  return '<div class="sync bk"><b>Cloud sync</b>'+inner+'</div>';
}
function cloudConnect(){
  var url=($('#cl-url')||{}).value,tok=($('#cl-token')||{}).value;
  url=(url||'').trim();tok=(tok||'').trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){toast('The link should start with https://script.google.com/');return}
  if(!tok){toast('Enter the secret word');return}
  var cfg={url:url,token:tok};
  toast('Connecting...');
  cloudGet(cfg).then(function(){
    CLOUD.cfg=cfg;try{localStorage.setItem(CKEY,JSON.stringify(cfg))}catch(e){}
    CLOUD.meta.rev=0;CLOUD.dirty=hasProgress();CLOUD.paused=false;cloudMetaSave();
    CLOUD.state='idle';render();
    return cloudPull();
  }).then(function(){if(CLOUD.cfg&&CLOUD.state==='ok')toast('Cloud sync is on')},function(e){toast(cloudErr(e))});
}
function cloudOff(){

  try{localStorage.removeItem(CKEY)}catch(e){}

}

function viewCards(){

/* ---------- fuse decks ---------- */
function artistMap(d){
  var m={};
  d.ids.forEach(function(id){var o=SONGS[id];if(!o)return;
    String(o.a||'').split(/\s*(?:,|&|\+|\bfeat\.?|\bft\.?|\bwith\b|\bx\b)\s*/i).forEach(function(x){x=x.trim();if(x)m[x.toLowerCase()]=m[x.toLowerCase()]||x})});
  return m;
}
function genreShare(d){
  var m={};d.ids.forEach(function(id){var o=SONGS[id];if(o&&o.g!=='Other')m[o.g]=(m[o.g]||0)+1});
  Object.keys(m).forEach(function(g){m[g]/=d.ids.length});return m;
}
/* Similarity of two decks: shared artists (weighted most) plus how much their genre mixes overlap. */
function deckSim(a,b){
  var am=artistMap(a),bm=artistMap(b),shared=Object.keys(am).filter(function(k){return bm[k]}).map(function(k){return am[k]});
  var na=Object.keys(am).length,nb=Object.keys(bm).length;
  var artist=shared.length/Math.max(1,Math.min(na,nb));
  var ga=genreShare(a),gb=genreShare(b),gov=0,top=null,topv=0;
  Object.keys(ga).forEach(function(g){if(gb[g]){var v=Math.min(ga[g],gb[g]);gov+=v;if(v>topv){topv=v;top=g}}});
  var sc=0.6*artist+0.4*gov,total=a.ids.length+b.ids.length;
  var ok=(shared.length>0||gov>=0.6)&&sc>=0.3&&total<=DECK_MAX*2;
  var why=[];
  if(shared.length)why.push('Shares '+shared.slice(0,3).join(', ')+(shared.length>3?' +'+(shared.length-3):''));
  if(gov>=0.3&&top)why.push(Math.round(gov*100)+'% same genre mix ('+top+')');
  return {sc:sc+(total<=DECK_MAX?0.1:0),ok:ok,why:why.join(' · ')||'Similar mix',total:total};
}
function fusePairs(){
  var ds=S.decks.filter(function(d){return !d.ex&&d.ids.length}),out=[];
  for(var i=0;i<ds.length;i++)for(var j=i+1;j<ds.length;j++){
    var r=deckSim(ds[i],ds[j]);if(r.ok)out.push({a:ds[i],b:ds[j],sc:r.sc,why:r.why,total:r.total});
  }
  out.sort(function(x,y){return y.sc-x.sc});
  return out.slice(0,8);
}
function fuseDecks(aid,bid,name){
  var a=S.decks.find(function(x){return x.id===aid}),b=S.decks.find(function(x){return x.id===bid});
  if(!a||!b||a===b)return null;
  b.ids.forEach(function(id){if(a.ids.indexOf(id)<0)a.ids.push(id)});
  a.name=name;delete a.ex;
  S.decks=S.decks.filter(function(x){return x!==b});
  save();return a;
}
function pairRowHtml(a,b,why,total){
  return '<button class="pickrow" data-act="fuse-go" data-a="'+a.id+'" data-b="'+b.id+'" style="flex-direction:column;align-items:flex-start">'
    +'<b>'+esc(a.name||'Untitled deck')+' + '+esc(b.name||'Untitled deck')+'</b>'
    +'<span>'+a.ids.length+' + '+b.ids.length+' = '+total+(total>DECK_MAX?' (needs a split)':'')+(why?' · '+esc(why):'')+'</span></button>';
}
function fuseSheetHtml(){
  var sh=ST.sheet,body='',title='Fuse decks';
  if(sh.type==='fuse'){
    var ps=fusePairs();
    body='<p class="sub" style="margin:0 0 12px">Decks that look alike. Pick a pair to merge into one.</p>'
      +(ps.length?ps.map(function(p){return pairRowHtml(p.a,p.b,p.why,p.total)}).join(''):'<p class="empty">No similar decks right now. You can still fuse by hand from inside a deck.</p>');
  }else if(sh.type==='fusepick'){
    var a=S.decks.find(function(x){return x.id===sh.a});
    title='Fuse with...';
    var rows=S.decks.filter(function(x){return a&&x!==a}).map(function(x){var r=deckSim(a,x);return {d:x,r:r}});
    rows.sort(function(p,q){return q.r.sc-p.r.sc});
    body='<p class="sub" style="margin:0 0 12px">Merge <b>'+esc(a?a.name:'')+'</b> with another deck. Most similar first.</p>'
      +(rows.length?rows.map(function(p){var x=p.d,t=a.ids.length+x.ids.length;
        return '<button class="pickrow" data-act="fuse-go" data-a="'+a.id+'" data-b="'+x.id+'" style="flex-direction:column;align-items:flex-start"><b>'+esc(x.name||'Untitled deck')+(x.ex?' (exported)':'')+'</b><span>'+x.ids.length+' songs · '+t+' together'+(t>DECK_MAX?' (needs a split)':'')+(p.r.why&&p.r.sc>=0.15?' · '+esc(p.r.why):'')+'</span></button>'}).join(''):'<p class="empty">No other decks.</p>');
  }else{
    var A=S.decks.find(function(x){return x.id===sh.a}),B=S.decks.find(function(x){return x.id===sh.b});
    if(!A||!B)return '';
    var tot=A.ids.filter(function(x){return B.ids.indexOf(x)<0}).length+B.ids.length;
    title='Name the fused deck';
    body='<p class="sub" style="margin:0 0 10px">'+esc(A.name)+' ('+A.ids.length+') + '+esc(B.name)+' ('+B.ids.length+') = '+tot+' songs.'+(tot>DECK_MAX?' That is over '+DECK_MAX+', so you will get a Split into Pt 1 and Pt 2 button on the Decks screen.':'')+'</p>'
      +((A.ex||B.ex)?'<p class="syncmsg" style="margin:0 0 10px">One of these was already exported. The fused deck counts as a new deck and is not exported yet, so export it again. The old playlist on YouTube Music stays as it is.</p>':'')
      +'<div class="actions" style="margin:0 0 10px"><button class="btn" data-act="fuse-name-set" data-name="'+esc(A.name)+'">Use "'+esc(A.name)+'"</button><button class="btn" data-act="fuse-name-set" data-name="'+esc(B.name)+'">Use "'+esc(B.name)+'"</button></div>'
      +'<input id="fuse-name" class="deckname" type="text" maxlength="40" value="'+esc(A.name)+'" aria-label="Fused deck name" autocomplete="off">'
      +'<button class="btn primary" style="width:100%;margin-top:12px" data-act="fuse-confirm" data-a="'+A.id+'" data-b="'+B.id+'">Fuse into one deck</button>';
  }
  return '<div class="sheet-bg" data-act="close-sheet"></div><div class="sheet'+(sh.type==='fusename'?'':' tall')+'" role="dialog" aria-label="'+title+'">'
    +'<div class="sheet-head"><h3 class="h3">'+title+'</h3><button class="btn" data-act="close-sheet">Cancel</button></div>'+body+'</div>';
}

/* ---------- export ---------- */
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function songLink(id){
  if(isSpot(id))return 'https://open.spotify.com/track/'+id;
  if(String(id).length===11)return 'https://music.youtube.com/watch?v='+id;
  return '';
}
function deckCsv(d){
  var out=['Title,Artist,Album,Link'];
  d.ids.forEach(function(id){var s=SONGS[id];out.push([s.t,s.a,'',songLink(id)].map(csvCell).join(','))});
  return out.join('\r\n')+'\r\n';
}
function ytSplit(d){
  var ok=[],miss=[];
  d.ids.forEach(function(id){var v=ytId(id);if(v)ok.push(v);else if(SONGS[id])miss.push(SONGS[id])});
  return {ok:ok,miss:miss};
}
function ytUrl(d){return 'https://www.youtube.com/watch_videos?video_ids='+ytSplit(d).ok.join(',')}
function exportName(d){return (String(d.name||'playlist').replace(/[^A-Za-z0-9 _-]+/g,'').trim()||'playlist')+'.csv'}
function exportSheetHtml(){
  var d=curDeck();if(!d)return '';
  return '<div class="sheet-bg" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-label="Export deck">'
    +'<div class="sheet-head"><h3 class="h3">Export '+esc(d.name||'deck')+'</h3><button class="btn" data-act="close-sheet">Close</button></div>'
    +'<ol class="steps"><li><b>Download the file.</b> It lists '+d.ids.length+' songs with title, artist and a link.</li>'
    +'<li><b>Open TuneMyMusic.</b> Choose File as the source, upload it, pick YouTube Music as the destination and sign in.</li>'
    +'<li><b>Come back here</b> and tap Mark as exported to archive this deck.</li></ol>'
    +(function(){var y=ytSplit(d);if(!y.ok.length)return '';
      return '<div class="ytx"><p class="syncmsg" style="margin:0 0 8px"><b>Exact songs:</b> '+y.ok.length+' of '+d.ids.length+' have a verified YouTube Music video, so this route cannot pick the wrong band.'
        +(y.miss.length?' Not matched ('+y.miss.length+'), add by hand: '+y.miss.map(function(s){return esc(s.t+' / '+s.a)}).join('; ')+'.':'')
        +'</p><div class="actions"><button class="btn primary" data-act="yt-playlist">Open exact songs on YouTube</button></div>'
        +'<p class="sub" style="margin:6px 0 12px">Opens a playlist of those videos. Tap Save playlist there and it lands in your YouTube Music library.</p></div>'})()
    +'<div class="actions"><button class="btn'+(ytSplit(d).ok.length?'':' primary')+'" data-act="export-csv">Download CSV</button>'
    +'<a class="btn" href="https://www.tunemymusic.com/transfer/csv-to-youtube-music" target="_blank" rel="noopener">Open TuneMyMusic</a>'
    +'<button class="btn" data-act="copy-sheet">Copy as text</button></div>'
    +(d.ex?'<p class="syncmsg" style="margin-top:12px">Already marked as exported.</p>':'<div class="actions"><button class="btn" data-act="mark-exported">Mark as exported</button></div>')
    +'</div>';
}
function exportCsv(){
  var d=curDeck();if(!d)return;
  var text=deckCsv(d),name=exportName(d);
  try{
    var file=new File([text],name,{type:'text/csv'});
    if(IS_IOS&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:name}).catch(function(e){if(!e||e.name!=='AbortError')dlText(text,name)});
      return;
    }
  }catch(e){}
  dlText(text,name);
}
function dlText(text,name){
  try{
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;
    document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href)},4000);
    toast('Saved '+name);
  }catch(e){toast('Could not save the file')}
}

function artistKeys(a){return String(a||'').toLowerCase().split(/\s*(?:,|&|\+|\bfeat\.?|\bft\.?|\bwith\b|\bx\b)\s*/).map(function(x){return x.trim()}).filter(Boolean)}
/* Recommended decks for a song: same artist already in the deck ranks highest, then the deck's share of the song's genre (40%+, never "Other"). Top REC_MAX (6), empty decks skipped. */
var REC_MAX=6;
function recDecks(id){
  var s=SONGS[id];if(!s)return [];
  var mine=artistKeys(s.a),out=[];
  S.decks.filter(deckOpen).forEach(function(d){
    if(!d.ids.length||d.ids.indexOf(id)>=0)return;
    var am=0,gm=0;
    d.ids.forEach(function(x){var o=SONGS[x];if(!o)return;
      if(artistKeys(o.a).some(function(k){return mine.indexOf(k)>=0}))am++;
      if(s.g!=='Other'&&o.g===s.g)gm++});
    var share=gm/d.ids.length,sc=0;
    if(am>0)sc=100+Math.min(am,5)*10+share*10;
    else if(share>=0.4&&gm>=2)sc=share*100;
    if(sc>0)out.push({id:d.id,sc:sc,n:d.ids.length});
  });
  out.sort(function(a,b){return b.sc-a.sc||b.n-a.n});
  return out.slice(0,REC_MAX).map(function(x){return x.id});
}
function ringHtml(id){
  var items=[];
  S.decks.filter(deckOpen).forEach(function(d){items.push({k:'deck',id:d.id,label:d.name||'Untitled deck',on:d.ids.indexOf(id)>=0,n:d.ids.length,last:d.ids.slice(-2).reverse().map(function(x){return SONGS[x]?SONGS[x].t:''}).filter(Boolean)})});
  var n=Math.max(items.length,1);
  var recs=recDecks(id),land=isLand();
  function tile(it,k,pos,cls){
    var th=-Math.PI/2+k*2*Math.PI/n;
    var st=pos?' style="left:'+(50+41*Math.cos(th)).toFixed(2)+'%;top:'+(50+41.67*Math.sin(th)).toFixed(2)+'%;--k:'+k+'"':' style="--k:'+k+'"';
    return '<button class="rit '+it.k+(it.on?' on':'')+(cls||'')+'" data-act="ring-'+it.k+'"'+(it.k==='deck'?' data-id="'+it.id+'" aria-pressed="'+(it.on?'true':'false')+'"':'')
      +st+'><span class="rl">'+esc(it.label)+'</span>'+(it.k==='deck'?'<span class="rc">'+it.n+'/'+DECK_MAX+'</span>':'')+(it.k==='deck'&&it.last&&it.last.length?'<span class="rs">'+it.last.map(function(t){return '<i>'+esc(t)+'</i>'}).join('')+'</span>':'')+'</button>';
  }
  var html='';
  if(land&&recs.length){
    html+='<div class="recwrap" style="grid-row:span '+Math.ceil(recs.length/3)+'"><span class="rechd">Recommended</span><div class="recrow">'
      +recs.map(function(rid,j){var it=items.filter(function(x){return x.id===rid})[0];return it?tile(it,j,false,' rec'):''}).join('')+'</div></div>';
  }
  html+=items.map(function(it,k){return tile(it,k,!land,(!land&&recs.indexOf(it.id)>=0)?' rec':'')}).join('');
  var cw=n<=4?52:n<=6?48:n<=8?44:n<=10?41:38;
  return {html:html,sz:Math.min(17,0.82*287/n),cw:cw};
}

/* ---------- actions ---------- */
/* ---------- reading the sheet ---------- */
function videoId(link){
  var m=/(?:embed\/|[?&]v=|youtu\.be\/)([A-Za-z0-9_-]{11})/.exec(link||'');
  return m?m[1]:'';
}
function parseRows(values){
  if(!values||!values.length)return [];
  var head=values[0].map(function(h){return String(h==null?'':h).trim().toLowerCase()});
  var iS=head.indexOf('song'),iA=head.indexOf('artist'),iL=head.indexOf('link'),iG=head.indexOf('genre');
  if(iS<0||iL<0)return null;
  var out=[],seen={};
  for(var r=1;r<values.length;r++){
    var row=values[r]||[];
    var cell=function(i){return i>=0&&row[i]!=null?String(row[i]).trim():''};
    var t=cell(iS);if(!t)continue;
    var a=cell(iA).replace(/\s*-\s*Topic\s*$/i,'').trim();
    var id=videoId(cell(iL))||('x'+hash(t+'|'+a).toString(36));
    if(seen[id])continue;
    seen[id]=1;
    out.push({id:id,t:t,a:a,g:gname(cell(iG))});
  }
  return out;
}
/* Songs the app has never seen become new packs, shuffled; songs it knows only get fresh details. */
function mergeRows(rows){
  rows=rows.concat(spotRows());
  var fresh=[],changed=0;
  rows.forEach(function(r){
    var old=SONGS[r.id];
    if(old){
      if(old.g!==r.g||old.t!==r.t||old.a!==r.a){old.g=r.g;old.t=r.t;old.a=r.a;delete artCache[r.id];delete planCache[r.id];changed++}
    }else{SONGS[r.id]={id:r.id,t:r.t,a:r.a,g:r.g};changed++}
    if(!S.seen[r.id]){S.seen[r.id]=1;fresh.push(r.id)}
  });
  shuffle(fresh);
  var made=0;
  while(fresh.length){S.packs.push({id:S.nid++,ids:fresh.splice(0,PACK_SIZE)});made++}
  if(made||changed)save();
  return {packs:made,changed:changed};
}
function softRender(){
  var a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')){
    $('#stats').textContent=ownedIds().length+' cards · '+S.decks.length+(S.decks.length===1?' deck':' decks');
    var b=$('#badge');b.textContent=S.packs.length;b.hidden=!S.packs.length;
    return;
  }
  render();
}
function syncError(e){
  if(e&&e.code==='no_url')return 'No sheet link is set up in this copy of the app yet.';
  if(e&&e.code&&String(e.code).indexOf('http_')===0)return 'Google said '+String(e.code).slice(5)+'. Check that the Song list tab is still published to the web.';
  return 'Could not reach your sheet. Check your connection and try again. Cards you already have still work.';
}
function applySheet(payload){
  var values=payload&&payload.values;
  var rows=parseRows(values);
  if(rows===null){SYNC.state='error';SYNC.msg='The sheet needs Song and link columns in its first row.';return false}
  rowsCache=rows;
  var m=mergeRows(rows);
  SYNC.state='ok';SYNC.total=rows.length;SYNC.note=m.packs?m.packs+(m.packs===1?' new pack added.':' new packs added.'):'';
  if(m.packs)toast(m.packs+(m.packs===1?' new pack':' new packs')+' ready to open');
  return true;
}
function parseCsv(t){
  var rows=[],row=[],f='',q=false,i,c;
  t=String(t||'').replace(/^﻿/,'');
  for(i=0;i<t.length;i++){
    c=t.charAt(i);
    if(q){if(c==='"'){if(t.charAt(i+1)==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t.charAt(i+1)==='\n')i++;row.push(f);f='';rows.push(row);row=[]}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
function fetchSheet(attempt){
  if(SYNC.busy)return;
  if(!CSV_URL||CSV_URL.indexOf('__')===0){SYNC.state='error';SYNC.msg=syncError({code:'no_url'});render();return}
  SYNC.busy=true;if(!attempt)render();
  var url=CSV_URL+(CSV_URL.indexOf('?')<0?'?':'&')+'cb='+Date.now();
  fetch(url,{cache:'no-store'}).then(function(r){
    if(!r.ok)throw {code:'http_'+r.status};
    return r.text();
  }).then(function(text){
    SYNC.busy=false;SYNC.at=Date.now();
    applySheet({values:parseCsv(text)});
    spotTick();softRender();
  },function(e){
    if(!attempt){SYNC.busy=false;setTimeout(function(){fetchSheet(1)},1500);return}
    SYNC.busy=false;SYNC.state='error';SYNC.msg=syncError(e);
    spotTick();softRender();
  });
}
function startSync(){fetchSheet(0)}

function deckText(d){
  return d.name+'\n'+d.ids.map(function(id,i){return (i+1)+'. '+SONGS[id].t+' by '+SONGS[id].a}).join('\n');
}
function copyDeck(){
  var d=curDeck();if(!d)return;
  var text=deckText(d),ta=$('#export');
  ta.value=text;
  var p;
  try{p=navigator.clipboard.writeText(text)}catch(e){p=Promise.reject(e)}
  p.then(function(){ta.hidden=true;toast('Playlist text copied')},function(){
    ta.hidden=false;ta.focus();ta.select();toast('Select the text below and copy it');
  });
}

/* press and hold a playlist tile to peek at its songs */
var LP={t:null,x:0,y:0,sup:false,supT:null};
function lpClear(){clearTimeout(LP.t);LP.t=null}
document.addEventListener('pointerdown',function(e){
  var b=e.target.closest&&e.target.closest('.rit[data-act="ring-deck"]');if(!b)return;
  LP.x=e.clientX;LP.y=e.clientY;lpClear();
  LP.t=setTimeout(function(){
    LP.t=null;LP.sup=true;clearTimeout(LP.supT);LP.supT=setTimeout(function(){LP.sup=false},1500);
    ST.sheet={type:'peek',did:+b.dataset.id};renderSheet(true);
  },420);
},true);
document.addEventListener('pointermove',function(e){if(LP.t&&(Math.abs(e.clientX-LP.x)>10||Math.abs(e.clientY-LP.y)>10))lpClear()},true);
['pointerup','pointercancel','scroll'].forEach(function(n){document.addEventListener(n,lpClear,true)});
document.addEventListener('contextmenu',function(e){if(e.target.closest&&e.target.closest('.rit'))e.preventDefault()},true);
document.addEventListener('click',function(e){
  if(LP.sup&&e.target.closest&&e.target.closest('.rit[data-act="ring-deck"]')){LP.sup=false;e.stopPropagation();e.preventDefault()}
},true);
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.dataset.act,sid=t.dataset.id,id=+sid,i=+t.dataset.i,d,cid;
  switch(act){
    case 'tab':
      if(t.dataset.tab===ST.tab&&ST.tab==='decks')ST.deckId=null;
      if(t.dataset.tab==='packs'&&ST.tab!=='packs')ST.pick=null;
      if(!ST.open&&!ST.radial)sndStop();
      ST.tab=t.dataset.tab;ST.confirmDel=false;ST.confirmReset=false;render();window.scrollTo(0,0);break;
    case 'sync':fetchSheet(0);break;
    case 'save-backup':saveBackup();break;
    case 'cloud-connect':cloudConnect();break;
    case 'cloud-now':CLOUD.paused=false;(CLOUD.dirty?cloudPush():cloudPull());break;
    case 'cloud-off':cloudOff();break;
    case 'cf-cloud':closeConflict();if(CLOUD.conflict)applyRemote(CLOUD.conflict);break;
    case 'cf-device':closeConflict();CLOUD.paused=false;CLOUD.dirty=true;cloudPush(true);break;
    case 'cf-later':closeConflict();CLOUD.paused=true;CLOUD.state='conflict';render();break;
    case 'load-backup':loadBackupPick();break;
    case 'reset':
      if(!ST.confirmReset){ST.confirmReset=true;render();break}
      S=fresh();SONGS=S.songs;artCache={};planCache={};ST.confirmReset=false;ST.deckId=null;
      save();if(rowsCache){var mm=mergeRows(rowsCache);toast('Started over. '+mm.packs+' packs ready.')}else{toast('Started over')}
      spotTick();
      render();break;
    case 'open-pack':beginOpen(id);break;
    case 'tear':tear();break;
    case 'flip':flipTap();break;
    case 'next':finishCard('kept');break;
    case 'skip':sndStop();if(ST.open){ST.open.phase='summary';renderOverlay()}break;
    case 'again':
      sndStop();ST.open=null;
      if(S.packs.length)beginOpen(S.packs[Math.floor(Math.random()*S.packs.length)].id);else renderOverlay();
      render();break;
    case 'done':sndStop();ST.open=null;ST.pick=null;renderOverlay();render();break;
    case 'card':
      ST.radial={id:sid};
      ST.radial.q=Array.prototype.map.call(document.querySelectorAll('#grid .cardbtn'),function(b){return b.dataset.id});
      ST.radial.u=ST.gf==='unsorted';
      renderOverlay();if(ST.auto)pvStart(sid);break;
    case 'next-song':gotoNext(false);break;
    case 'close-radial':sndStop();ST.radial=null;renderOverlay();render();break;
    case 'auto-toggle':toggleAuto();break;
    case 'listen':sndStop();break;
    case 'toggle-play':
      cid=curCardId();
      if(isPlaying())sndStop();else if(cid!==null)pvStart(cid);
      break;
    case 'ring-deck':
      cid=curCardId();d=S.decks.find(function(x){return x.id===id});
      if(d&&cid!==null&&!deckOpen(d)&&d.ids.indexOf(cid)<0){toast(d.name+' is full');break}
      if(d&&cid!==null){
        var k=d.ids.indexOf(cid),was=deckOf(cid);
        if(k>=0){d.ids.splice(k,1);toast('Removed from '+d.name)}
        else{leaveOtherDecks(cid,d);d.ids.push(cid);toast(deckFull(d)?d.name+' is full at '+DECK_MAX+' songs. Ready to export.':(was?'Moved to ':'Added to ')+d.name)}
        save();
        if(k<0&&advanceIfQueue())break;
        fillRing(cid,true);render();
      }
      break;
    case 'ring-new':
      cid=curCardId();
      if(cid!==null)openNamePanel(cid);
      break;
    case 'newdeck-ok':makeNamedDeck();break;
    case 'newdeck-cancel':closeNamePanel();
      break;
    case 'ring-none':
      cid=curCardId();
      if(cid!==null){
        S.decks.forEach(function(x){var k2=x.ids.indexOf(cid);if(k2>=0)x.ids.splice(k2,1)});
        save();toast('Kept with no deck');finishCard('kept');
      }
      break;
    case 'ring-junk':
      cid=curCardId();
      if(cid!==null){junkSong(cid);toast('Moved to Junk');finishCard('junked')}
      break;
    case 'junk-open':ST.sheet={type:'junk'};renderSheet(true);break;
    case 'junk-restore':if(S.junk&&S.junk[sid]){delete S.junk[sid];S.owned[sid]={n:S.seq++};save();renderSheet();render();toast('Restored to your cards')}break;
    case 'junk-delete':if(S.junk&&S.junk[sid]){delete S.junk[sid];save();renderSheet();render();toast('Deleted for good')}break;
    case 'ring-recycle':
      cid=curCardId();
      if(cid!==null){var rp=recycle(cid);toast('Recycled into pack No. '+pad3(rp.id));finishCard('recycled')}
      break;
    case 'gfilter':ST.gf=t.dataset.g;render();break;
    case 'new-deck':
      d=newDeck();ST.deckId=d.id;ST.confirmDel=false;render();window.scrollTo(0,0);
      var inp=$('#deck-name');if(inp){inp.focus();inp.select()}
      break;
    case 'split-decks':
      if(!ST.confirmSplit){ST.confirmSplit=true;render();break}
      ST.confirmSplit=false;var r=splitDecks();render();toast('Split '+r.n+(r.n===1?' deck':' decks')+' into '+(r.n+r.made)+' parts. Ready to export.');break;
    case 'fuse-open':ST.sheet={type:'fuse'};renderSheet(true);break;
    case 'fuse-pick':d=curDeck();if(d){ST.sheet={type:'fusepick',a:d.id};renderSheet(true)}break;
    case 'fuse-go':ST.sheet={type:'fusename',a:+t.dataset.a,b:+t.dataset.b};renderSheet(true);break;
    case 'fuse-name-set':var fi=$('#fuse-name');if(fi){fi.value=t.dataset.name;fi.focus()}break;
    case 'fuse-confirm':
      var fn=($('#fuse-name').value||'').trim()||'Fused deck',fa=fuseDecks(+t.dataset.a,+t.dataset.b,fn);
      ST.sheet=null;renderSheet();
      if(fa){ST.deckId=null;ST.tab='decks';render();toast('Fused into '+fa.name+' ('+fa.ids.length+' songs)'+(fa.ids.length>DECK_MAX?'. Use Split to make it exportable.':''))}
      break;
    case 'open-deck':ST.deckId=id;ST.confirmDel=false;render();window.scrollTo(0,0);break;
    case 'back-decks':sndStop();ST.deckId=null;ST.confirmDel=false;render();break;
    case 'add-songs':ST.sheet={type:'add'};ST.addq='';renderSheet(true);break;
    case 'close-sheet':if(ST.sheet&&(ST.sheet.type==='peek'||ST.sheet.type==='move'))sndStop();ST.sheet=null;renderSheet();break;
    case 'row-play':rowPlay(sid);break;
    case 'move':ST.sheet={type:'move',sid:sid};renderSheet(true);break;
    case 'move-to':
      d=S.decks.find(function(x){return x.id===id});
      if(d&&ST.sheet&&ST.sheet.sid){
        var ms=ST.sheet.sid;
        if(deckFull(d)&&d.ids.indexOf(ms)<0){toast(d.name+' is full');break}
        leaveOtherDecks(ms,d);if(d.ids.indexOf(ms)<0)d.ids.push(ms);
        save();ST.sheet=null;renderSheet();render();toast('Moved to '+d.name);
      }
      break;
    case 'move-junk':
      if(ST.sheet&&ST.sheet.sid){junkSong(ST.sheet.sid);sndStop();ST.sheet=null;renderSheet();render();toast('Moved to Junk')}
      break;
    case 'peek-add':
      sndStop();ST.sheet=null;renderSheet();
      LP.sup=false;
      var tile=document.querySelector('.rit[data-act="ring-deck"][data-id="'+sid+'"]');
      if(tile)tile.click();
      break;
    case 'add-one':
      d=curDeck();
      if(d&&d.ids.indexOf(sid)<0&&!deckFull(d)){
        leaveOtherDecks(sid,d);d.ids.push(sid);save();render();
        if(deckFull(d)){ST.sheet=null;renderSheet();toast(d.name+' is full at '+DECK_MAX+' songs. Ready to export.')}
        else{var al=$('#addlist');if(al)al.innerHTML=addRows()}
      }
      break;
    case 'copy':copyDeck();break;
    case 'export':ST.sheet={type:'export'};renderSheet(true);break;
    case 'yt-playlist':{d=curDeck();if(d&&ytSplit(d).ok.length)window.open(ytUrl(d),'_blank','noopener');break}
    case 'export-csv':exportCsv();break;
    case 'copy-sheet':{d=curDeck();if(d){var tx=deckText(d);try{navigator.clipboard.writeText(tx).then(function(){toast('Playlist text copied')},function(){toast('Could not copy')})}catch(e2){toast('Could not copy')}}break}
    case 'mark-exported':d=curDeck();if(d){d.ex=Date.now();save();ST.sheet=null;renderSheet();ST.deckId=null;render();toast(d.name+' moved to Exported')}break;
    case 'reopen':d=curDeck();if(d){delete d.ex;save();render();toast('Deck reopened')}break;
    case 'del':
      if(!ST.confirmDel){ST.confirmDel=true;render();break}
      S.decks=S.decks.filter(function(x){return x.id!==ST.deckId});
      ST.deckId=null;ST.confirmDel=false;save();render();toast('Deck deleted');break;
    case 'up':
    case 'down':
      d=curDeck();
      if(d){var j=act==='up'?i-1:i+1;if(j>=0&&j<d.ids.length){var tmp=d.ids[i];d.ids[i]=d.ids[j];d.ids[j]=tmp;save();render()}}
      break;
    case 'rm':
      d=curDeck();if(d){d.ids.splice(i,1);save();render()}break;
  }
});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='q'){ST.q=e.target.value;renderGrid()}
  else if(id==='add-q'){ST.addq=e.target.value;var al=$('#addlist');if(al)al.innerHTML=addRows()}
  else if(id==='deck-name'){var d=curDeck();if(d){d.name=e.target.value.slice(0,40);save()}}
});
document.addEventListener('change',function(e){
  if(e.target.id==='sort'){ST.sort=e.target.value;renderGrid()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='deck-name'){e.target.blur()}
  if(e.key==='Enter'&&e.target.id==='newdeck-name'){makeNamedDeck();return}
  if(e.key==='Escape'&&document.getElementById('namepanel')){closeNamePanel();return}
  if(e.key==='Escape'){
    if(ST.sheet){ST.sheet=null;renderSheet()}
    else if(ST.radial){sndStop();ST.radial=null;renderOverlay();render()}
    else if(ST.open&&ST.open.phase!=='cards'){sndStop();ST.open=null;renderOverlay();render()}
  }
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){sndStop();return}
  if(SYNC.state==='ok'&&Date.now()-SYNC.at>60000)fetchSheet(0);
});

render();
loadArt();
loadSpot();
initYT();
cloudLoad();
if(CLOUD.cfg)cloudPull().then(startSync,startSync);else startSync();
})();
</script>
